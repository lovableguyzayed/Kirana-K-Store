# Typechecks every package and builds the API server on each pull request,
# so broken code is caught before it reaches main (and Render / installed apps).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Shipped packages only. artifacts/mockup-sandbox (a design-preview
      # sandbox that is never deployed) has pre-existing React type conflicts
      # and is intentionally excluded.
      - name: Typecheck shared libraries
        run: pnpm run typecheck:libs

      - name: Typecheck API server and app
        run: pnpm --filter @workspace/api-server --filter @workspace/kirana-konnect run typecheck

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build
